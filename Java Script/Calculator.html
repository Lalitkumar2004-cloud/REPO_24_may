<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>body{
        text-align: center;
    }
    
        .calculator{
            display: inline-block;
            padding-bottom: 10px;
            padding-left: 10px;
            padding-right: 10px;
            background-color: black;
           
            border: 2px solid black;
            border-radius: 10px;
        }
            
            
            .buttons{
                display:grid;
                grid-template-columns:repeat(4,50px);
                grid-template-rows: 100px repeat(5,50px);
                gap:10px;
                background-color: black;
                padding: 20px;
                width:230px;
            }
            #screen{
                grid-column:1 / 4 span;
                border: 2px solid rgba(215, 214, 214, 0.144);
                border-radius: 2px;
            }
        
            .buttons>div{
                border: 2px solid rgba(215, 214, 214, 0.144);
                border-radius: 50%;
                text-align: center;
                padding-top: 10px;
                font-size:x-large;
                font-weight:bold;
                color:white;
                background-color: rgba(153, 150, 150, 0.374);
            }
            div{color:blue;}
           
            ul{list-style-type:decimal;}
            .welcome{list-style-type:initial;}
            
            .a1{text-decoration:initial;}  
        
        .button{
            display: grid;
           column-gap: 10px;
           row-gap: 10px;
           grid-template-columns: repeat(4,50px);
           grid-template-rows:  repeat(5 , 50px);
           padding-top: 10px;
         
         
        }
        .display 
        {
           
            display: grid;
            width: 100%;
            height: 35px;
           margin-left: -11px;
           padding-left: 16px;
            text-align: right;
            border-radius: 10px;
            background-color: white;

        }
     
         button{
            border: none;
            border-radius: 110px;
            color: white;
            background-color: rgba(112, 44, 44, 0.425);
           
        }
       .backbutton{
        display:inline-block;
        margin-left: 13%;
       margin-top: 14px;
      border-radius: 100px;
       }
    </style>
</head>
<body>
    <h1>Calculator</h1>
    <div class="calculator">
        <input type="text" class="display" id="display" disabled >
        <button id="screen" onclick="backspace('')">&#9003</button>
    <div class="button">
   
    <button onclick="cleardisplay()">c</button>
    <button onclick="appendValue('()')">()</button>
    <button onclick="appendValue('%')">%</button>
    <button onclick="appendValue('&divide;')">&divide;</button>
    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button onclick="appendValue('&times;')">&times;</button>
    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button onclick="appendValue('-')">-</button>
    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button onclick="appendValue('+')">+</button>
    <button onclick="appendValue('+/-')">+/-</button>
    <button onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button onclick="calculateResult()">=</button>
</div>

</div>
<footer>
<div class="backbutton">
   <a href="home.html"> <button onclick="gohome()" type="button" style="background-color: black; border: 2px solid black;width: 50px ; height: 50px;">Back</button></a>
</div>
</footer>
<script>
    function appendValue(value){
        document.getElementById('display').value +=value;

    }
    function cleardisplay(){
        document.getElementById('display').value="";

    }

    function backspace(){
       let screen = document.getElementById('screen');
       display.value= display.value .slice(0,-1);
    }
    function calculateResult() {
            try {
                document.getElementById("display").value = eval(document.getElementById("display").value);
            } catch {
                document.getElementById("display").value = "Error";
            }
        }
    function gohome(){
        window.location.href = "home.html";

    }
</script>





</body>
</html>
