<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
            width: 320px;
        }
        button {
            width: 100px;
            height: 100px;
            font-size: 2em;
            border: 2px solid black;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Tic-Tac-Toe</h1>
    <div class="board" id="board">
        <button id="btn1" onclick="makeMove(0)"></button>
        <button id="btn2" onclick="makeMove(1)"></button>
        <button id="btn3" onclick="makeMove(2)"></button>
        <button id="btn4" onclick="makeMove(3)"></button>
        <button id="btn5" onclick="makeMove(4)"></button>
        <button id="btn6" onclick="makeMove(5)"></button>
        <button id="btn7" onclick="makeMove(6)"></button>
        <button id="btn8" onclick="makeMove(7)"></button>
        <button id="btn9" onclick="makeMove(8)"></button>
    </div>
    <p id="status"></p>
    <button onclick="resetGame()">Reset</button>
    
    <script>
        let currentPlayer = "X";
        let board = ["", "", "", "", "", "", "", "", ""];
        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], 
            [0, 3, 6], [1, 4, 7], [2, 5, 8], 
            [0, 4, 8], [2, 4, 6]
        ];
        
        function makeMove(index) {
            if (board[index] === "" && !checkWinner()) {
                board[index] = currentPlayer;
                document.getElementById("btn" + (index + 1)).textContent = currentPlayer;
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                checkWinner();
            }
        }
        
        function checkWinner() {
            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    document.getElementById("status").textContent = `Winner: ${board[a]}`;
                    return true;
                }
            }
            if (!board.includes("")) {
                document.getElementById("status").textContent = "Draw!";
                return true;
            }
            return false;
        }
        
        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            document.getElementById("status").textContent = "";
            for (let i = 1; i <= 9; i++) {
                document.getElementById("btn" + i).textContent = "";
            }
        }
    </script>
</body>
</html>
