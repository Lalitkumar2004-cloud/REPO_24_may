<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>String</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    textarea, input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .output {
      background: #fff;
      padding: 15px;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      white-space: pre-wrap;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>JS String </h1>

  <h2>1. Text Formatter</h2>
  <textarea id="formatterInput" placeholder="Enter your text..."></textarea>
  <button onclick="toUpper()">UPPERCASE</button>
  <button onclick="toLower()">lowercase</button>
  <button onclick="trimText()">Trim</button>
  <button onclick="wordCount()">Word Count</button>
  <div class="output" id="formatterOutput"></div>

  <h2>2. Password Strength Checker</h2>
  <input type="text" id="passwordInput" placeholder="Enter password">
  <button onclick="checkPassword()">Check Strength</button>
  <div class="output" id="passwordOutput"></div>

 

  <script>
    function toUpper() {
      const text = document.getElementById("formatterInput").value;
      document.getElementById("formatterOutput").innerText = text.toUpperCase();
    }

    function toLower() {
      const text = document.getElementById("formatterInput").value;
      document.getElementById("formatterOutput").innerText = text.toLowerCase();
    }

    function trimText() {
      const text = document.getElementById("formatterInput").value;
      document.getElementById("formatterOutput").innerText = text.trim();
    }

    function wordCount() {
      const text = document.getElementById("formatterInput").value.trim();
      const words = text.split(/\s+/);
      document.getElementById("formatterOutput").innerText = `Word Count: ${words.length}`;
    }

    function checkPassword() {
      const pwd = document.getElementById("passwordInput").value;
      let strength = "Weak";
      if (pwd.length >= 8 && /[A-Z]/.test(pwd) && /[a-z]/.test(pwd) && /\d/.test(pwd) && /[!@#$%^&*]/.test(pwd)) {
        strength = "Strong";
      } else if (pwd.length >= 6) {
        strength = "Moderate";
      }
      document.getElementById("passwordOutput").innerText = `Password Strength: ${strength}`;
    }

  

    



  
  </script>

</body>
</html>
